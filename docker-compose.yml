services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "AdPulse!Dev2025" }
    ports: ["1433:1433"]
  api:
    build: { context: ., dockerfile: src/AdPulse.Api/Dockerfile }
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__Default: "Server=mssql,1433;Database=adpulse;User Id=sa;Password=AdPulse!Dev2025;TrustServerCertificate=True"
      Logging__LogstashTcp: "tcp://logstash:5000"
    ports: ["8080:8080"]
    depends_on: [mssql, logstash]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: ["9200:9200"]
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    volumes: ["./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"]
    ports: ["5000:5000"]
    depends_on: [elasticsearch]
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment: { ELASTICSEARCH_HOSTS: "http://elasticsearch:9200" }
    ports: ["5601:5601"]
    depends_on: [elasticsearch]
