# Render blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: adpulse-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./src/AdPulse.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Postgres
      - key: ConnectionStrings__Default
        sync: false   # set in the Render dashboard (Supabase pooler connection string)
      - key: Cors__Origins__0
        value: https://adpulse-dashboard-nu.vercel.app
