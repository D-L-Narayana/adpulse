name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "AdPulse!Ci2025" }
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'AdPulse!Ci2025' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Unit + API tests (SQLite)
        run: dotnet test tests/AdPulse.Tests -c Release --no-build --logger "trx"
      - name: API tests against SQL Server
        env:
          Database__Provider: SqlServer
          ConnectionStrings__Default: "Server=localhost,1433;Database=adpulse_ci;User Id=sa;Password=AdPulse!Ci2025;TrustServerCertificate=True"
        run: dotnet test tests/AdPulse.Tests -c Release --no-build
      - name: BDD specs (Reqnroll)
        run: dotnet test tests/AdPulse.Specs -c Release --no-build
      - name: Docker image
        run: docker build -t adpulse-api:ci -f src/AdPulse.Api/Dockerfile .
