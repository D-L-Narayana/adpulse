name: CI
on: [push, pull_request]

jobs:
  api:
    name: API • build, test (SQLite + SQL Server 2022), coverage, docker
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "AdPulse!Ci2025" }
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'AdPulse!Ci2025' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      - name: xUnit integration tests + Reqnroll BDD specs (SQLite, with Coverlet coverage)
        run: >-
          dotnet test -c Release --no-build
          --collect:"XPlat Code Coverage" --results-directory TestResults/sqlite
          --logger "trx;LogFileName=sqlite.trx"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Same suites against SQL Server 2022 service container
        env:
          ADPULSE_TEST_PROVIDER: SqlServer
          ADPULSE_TEST_CONNECTION: "Server=localhost,1433;Database=adpulse_ci;User Id=sa;Password=AdPulse!Ci2025;TrustServerCertificate=True"
        run: >-
          dotnet test -c Release --no-build
          --results-directory TestResults/sqlserver --logger "trx;LogFileName=sqlserver.trx"

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: TestResults/sqlite/**/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both
      - name: Publish coverage summary to job
        if: always()
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-coverage
          path: TestResults/

      - name: Docker image
        run: docker build -t adpulse-api:ci -f src/AdPulse.Api/Dockerfile src/AdPulse.Api

  web:
    name: Web • Vue 3 dashboard type-check + build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
