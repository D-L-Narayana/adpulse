# AdPulse API -> Serilog (compact JSON over TCP) -> Logstash -> Elasticsearch -> Kibana
input {
  tcp { port => 5000 codec => json_lines }
}
filter {
  date { match => ["@t", "ISO8601"] target => "@timestamp" }
  mutate {
    rename => { "@m" => "message" "@l" => "level" "RequestPath" => "http.path" "StatusCode" => "http.status" "Elapsed" => "http.elapsed_ms" }
    remove_field => ["@i", "@mt"]
  }
}
output {
  elasticsearch { hosts => ["http://elasticsearch:9200"] index => "adpulse-%{[Application]}-%{+YYYY.MM.dd}" }
}
